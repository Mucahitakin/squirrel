# v* etiketi push'lanınca macOS + Windows paketlerini derler ve GitHub
# Release'ine (güncelleyici metadata dosyalarıyla birlikte) yükler.
#   Kullanım:  npm version minor  →  git push origin main --tags
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Release'i tek bir iş önceden oluşturur; derleme işleri VAR OLAN release'e
  # yükler. (İki derleme aynı anda "yoksa oluştur" derse aynı tag'e iki
  # release açılıyor — v2.3.0'da yaşandı.)
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release for tag (if missing)
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Squirrel ${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create-release
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build & publish
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
